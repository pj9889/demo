<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Site</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}

/* MAIN */
.marquee{background:#fff;padding:10px;color:red;white-space:nowrap;overflow:hidden}
.image-box{display:flex;gap:10px;padding:10px}
.image-box img{width:50%;border-radius:10px}

/* BUTTON */
.buy-btn{
width:90%;margin:20px auto;display:block;
padding:15px;background:#ff0066;color:#fff;
border:none;border-radius:30px;font-size:18px;
}

/* CALL UI */
#callUI{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.9);
color:white;
z-index:99999;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

#videoCall{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:black;
z-index:999999;
}

#videoCall video{
width:100%;
height:100%;
object-fit:cover;
}

#controls{
display:none;
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:1000000;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:20px;
color:white;
gap:10px;
}
</style>
</head>

<body>

<div class="marquee">
আমার নাম সুরভী 😚 আমি ভিডিও কলে সার্ভিস দেই 😘
</div>

<div class="image-box">
<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTFEF7weCUrBOFgSVePZK1du7rnRUkLsCYQM9rZSAaqmmUt_3_vEWPkRlLogk6D3sOTRQ5FayaFNt6J6zHt7St-Wf-p0CekETxYZ2L5qBkO2tb03JUIlqXkqYsxhsVs2CtsOmbg1VZ6bGJwoEcXqzn_cjYomYeXiD0SCZw52v2ppQ3S6C9MzcMYFlIpxmU/s640/WhatsApp%20Image.jpeg">
<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCZKnYgE_idUV7fwznkXuY3XRfTR2BMrNulZl4Aofom_1BFBGQJy39wI5mZk_x5Z3n5xfJzz8OlH7lVx9E0ko300MHmmPTR2tdyB9qkLFg9jT9YLZiGpQZNxUBqdqJ0zRqkYT_gk8JxMHQEE2NnEeVj7neeErT5V_RwM1QeXPqNuw5VGvuxa80mxTdHdGe/s640/WhatsApp%20Image.jpeg">
</div>

<button class="buy-btn" onclick="startService()">Start Service</button>

<!-- 📞 CALL SCREEN -->
<div id="callUI">
<img src="https://i.ibb.co/0jqHpnp/profile.png" style="width:100px;height:100px;border-radius:50%">
<h2>Surovi (Incoming Call)</h2>
<p>Incoming Video Call...</p>

<div style="margin-top:20px;">
<button onclick="acceptCall()" style="padding:10px 20px;background:green;color:#fff;border:none;">Accept</button>
<button onclick="declineCall()" style="padding:10px 20px;background:red;color:#fff;border:none;">Decline</button>
</div>
</div>

<!-- 📹 VIDEO CALL -->
<div id="videoCall">
<video autoplay loop muted>
<source src="https://files.catbox.moe/yomh8x.mp4">
</video>
</div>

<!-- 🎛️ CONTROLS -->
<div id="controls">
<button onclick="toggleMute()">🔇</button>
<button onclick="endCall()">❌</button>
</div>

<!-- 🔊 RINGTONE -->
<audio id="ringtone" loop>
<source src="https://files.catbox.moe/8u5x9r.mp3">
</audio>

<script>

let ringtone=document.getElementById("ringtone");
let video=document.querySelector("#videoCall video");

/* ✅ FIXED AUTO CALL */
function startService(){
setTimeout(showCall,15000);
alert("Service Started (Demo)");
}

function showCall(){
document.getElementById("callUI").style.display="flex";
ringtone.play().catch(()=>{});

if(navigator.vibrate){
navigator.vibrate([500,300,500]);
}
}

function declineCall(){
document.getElementById("callUI").style.display="none";
ringtone.pause();

/* repeat call */
setTimeout(showCall,5000);
}

function acceptCall(){
document.getElementById("callUI").style.display="none";
document.getElementById("videoCall").style.display="block";
document.getElementById("controls").style.display="flex";
ringtone.pause();
}

function endCall(){
document.getElementById("videoCall").style.display="none";
document.getElementById("controls").style.display="none";
}

function toggleMute(){
video.muted=!video.muted;
}

</script>

</body>
</html>
