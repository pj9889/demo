<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Service Site</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}

/* TOP LOADING */
#topLoading{
display:none;position:fixed;top:0;left:0;width:100%;
background:black;color:white;text-align:center;
padding:10px;z-index:9999;font-weight:bold;
}

/* marquee */
.marquee{background:#fff;border:1px solid #000;overflow:hidden}
.marquee p{color:red;padding:10px;white-space:nowrap;animation:scroll 15s linear infinite}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* images */
.image-box{display:flex;gap:10px;padding:10px}
.image-box img{width:50%;aspect-ratio:4/6;border-radius:10px}

/* title */
.section-title{padding:10px;border-bottom:3px solid red;margin:10px}

/* service */
.service-box{background:pink;border:1px solid black;margin:10px;padding:10px;border-radius:10px}

/* messenger */
.messenger-box{display:none;background:#fff;margin:10px;padding:10px;border-radius:10px}
.input-area{display:none;margin-top:10px}

/* input */
input[type=text]{width:100%;padding:10px;box-sizing:border-box;font-size:16px}

/* BUY BUTTON */
.buy-btn{
display:block;width:90%;margin:20px auto;padding:15px;
background:#ff0066;color:white;border:none;border-radius:30px;
font-size:18px;position:relative;overflow:hidden;text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.buy-btn.loading::before{
content:"";position:absolute;left:0;top:0;height:100%;width:0%;
background:gold;animation:buyLoad 2s linear forwards;
}

@keyframes buyLoad{from{width:0%}to{width:100%}}

#paymentPage{display:none;padding:15px}

.payment-card{background:#ff0055;color:white;padding:15px;border-radius:15px}
.white-box{background:#fff;color:black;border-radius:15px;padding:15px;margin-top:10px}
.amount{color:green}

/* submit */
.submit-btn{
margin-top:15px;width:100%;padding:15px;
background:green;color:white;border:none;border-radius:10px;font-size:18px;
}

/* 📞 CALL UI */
#callOverlay{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:black;color:white;z-index:99999;
justify-content:center;align-items:center;flex-direction:column;
}

/* 📹 VIDEO SCREEN */
#videoCallScreen{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:black;z-index:999999;
}
</style>
</head>

<body>

<div id="topLoading">Please Wait...</div>

<div id="mainPage">

<div class="marquee">
<p>আমার নাম সুরভী 😚 আমি ভিডিও কলে সার্ভিস দিয়ে থাকি 😘</p>
</div>

<div class="image-box">
<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhTFEF7weCUrBOFgSVePZK1du7rnRUkLsCYQM9rZSAaqmmUt_3_vEWPkRlLogk6D3sOTRQ5FayaFNt6J6zHt7St-Wf-p0CekETxYZ2L5qBkO2tb03JUIlqXkqYsxhsVs2CtsOmbg1VZ6bGJwoEcXqzn_cjYomYeXiD0SCZw52v2ppQ3S6C9MzcMYFlIpxmU/s640/WhatsApp%20Image.jpeg">
<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCZKnYgE_idUV7fwznkXuY3XRfTR2BMrNulZl4Aofom_1BFBGQJy39wI5mZk_x5Z3n5xfJzz8OlH7lVx9E0ko300MHmmPTR2tdyB9qkLFg9jT9YLZiGpQZNxUBqdqJ0zRqkYT_gk8JxMHQEE2NnEeVj7neeErT5V_RwM1QeXPqNuw5VGvuxa80mxTdHdGe/s640/WhatsApp%20Image.jpeg">
</div>

<div class="section-title">কতক্ষণ সার্ভিস নিবেন:</div>

<div class="service-box">
<div onclick="selectService(150,0)">0৩ মিনিট - ১৫০ টাকা <input type="radio" name="service"></div>
<div onclick="selectService(250,1)">0৫ মিনিট - ২৫০ টাকা <input type="radio" name="service"></div>
<div onclick="selectService(400,2)">১০ মিনিট - ৪০০ টাকা <input type="radio" name="service"></div>
</div>

<div class="messenger-box" id="messengerBox">
<div class="section-title">মেসেঞ্জার বাছাই করুন:</div>

<div onclick="selectMessenger('WhatsApp',0)"><input type="radio" name="msg"> WhatsApp</div>
<div onclick="selectMessenger('Telegram',1)"><input type="radio" name="msg"> Telegram</div>
<div onclick="selectMessenger('Imo',2)"><input type="radio" name="msg"> Imo</div>

<div class="input-area" id="inputArea">
<p id="inputLabel" style="color:red;"></p>
<input type="text" id="userInput">
</div>
</div>

<button class="buy-btn" onclick="buyService()">সার্ভিস কিনুন</button>

</div>

<!-- 📞 CALL UI -->
<div id="callOverlay">
<img src="https://i.ibb.co/0jqHpnp/profile.png" style="width:100px;height:100px;border-radius:50%">
<h2>Surovi (Demo Call)</h2>
<p>Incoming Video Call...</p>

<div>
<button onclick="acceptCall()" style="background:green;color:#fff;padding:10px 20px;">Accept</button>
<button onclick="declineCall()" style="background:red;color:#fff;padding:10px 20px;">Decline</button>
</div>
</div>

<!-- 📹 VIDEO -->
<div id="videoCallScreen">
<video autoplay loop style="width:100%;height:100%;object-fit:cover;">
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>

<video id="selfVideo" autoplay muted style="position:absolute;bottom:20px;right:20px;width:120px;height:150px;"></video>

<button onclick="endCall()" style="position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:10px 20px;">End</button>
</div>

<script>

let selectedAmount=0;

function selectService(a,i){
document.getElementsByName("service")[i].checked=true;
selectedAmount=a;
document.getElementById("messengerBox").style.display="block";
}

function selectMessenger(name,i){
document.getElementsByName("msg")[i].checked=true;
document.getElementById("inputArea").style.display="block";
}

function buyService(){
alert("Demo version");
}

/* CALL SYSTEM */
setTimeout(showCall,10000);

function showCall(){
document.getElementById("callOverlay").style.display="flex";
setTimeout(()=>{declineCall()},15000);
}

function declineCall(){
document.getElementById("callOverlay").style.display="none";
setTimeout(showCall,5000);
}

async function acceptCall(){
document.getElementById("callOverlay").style.display="none";
document.getElementById("videoCallScreen").style.display="block";

let stream=await navigator.mediaDevices.getUserMedia({video:true});
document.getElementById("selfVideo").srcObject=stream;
}

function endCall(){
document.getElementById("videoCallScreen").style.display="none";
}

</script>

</body>
</html>
