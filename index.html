<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survi Service</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

/* profile */
.profile-img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-top:20px;
border:3px solid #ff4d4d;
}

h1{margin:10px 0;}

.img-row{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.img-row img{
width:45%;
border-radius:10px;
}

.desc{
padding:15px;
font-size:15px;
color:#333;
max-width:500px;
margin:auto;
line-height:1.5;
}

.btn{
background:red;
color:white;
padding:15px 25px;
border:none;
font-size:18px;
cursor:pointer;
margin-top:15px;
border-radius:5px;
position:relative;
overflow:hidden;
}

.btn::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:yellow;
transition:2s;
opacity:0.5;
}

.btn:hover::after{
left:0;
}

/* payment page */
#paymentPage{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#eee;
padding-top:80px;
}

.payBox{
background:white;
padding:30px;
margin:auto;
width:80%;
max-width:400px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* call popup */
#callPopup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
align-items:center;
justify-content:center;
}

#callBox{
background:#111;
padding:20px;
border-radius:10px;
width:300px;
color:white;
}

video{width:100%;border-radius:10px;}

.small{font-size:12px;color:yellow;}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="mainPage">

<img class="profile-img" src="https://files.catbox.moe/hnc2d4.jpeg">
<h1>সুরভী খাতুন</h1>

<div class="img-row">
<img src="https://files.catbox.moe/lj7phy.jpeg">
<img src="https://files.catbox.moe/47p5f3.jpeg">
</div>

<div class="desc">
আমি সুরভী খাতুন। আমি নিয়মিত ভিডিও কল সার্ভিস দিয়ে থাকি।  
আপনার যদি ভিডিও কল সার্ভিস প্রয়োজন হয় তাহলে আপনি আমাকে কল করতে পারেন।  
আমার সার্ভিস প্রিমিয়াম এবং ভিআইপি।
</div>

<button class="btn" onclick="openPayment()">সার্ভিস কিনুন</button>

</div>

<!-- PAYMENT PAGE -->
<div id="paymentPage">
<div class="payBox">
<h2>💳 Payment Page</h2>
<p>এখানে পরে bKash / Nagad যোগ করা হবে</p>
<br>
<button onclick="backHome()">⬅ Back</button>
</div>
</div>

<!-- DEMO CALL -->
<div id="callPopup">
<div id="callBox">
<div class="small">DEMO CALL (15 sec auto)</div>
<video id="callVideo" controls></video>
<br>
<button onclick="closeCall()">Close</button>
</div>
</div>

<script>

function openPayment(){
let btn=document.querySelector(".btn");
btn.style.background="yellow";
btn.style.color="black";

setTimeout(()=>{
document.getElementById("mainPage").style.display="none";
document.getElementById("paymentPage").style.display="block";
},2000);
}

function backHome(){
document.getElementById("paymentPage").style.display="none";
document.getElementById("mainPage").style.display="block";
}

// auto call
setTimeout(()=>{
document.getElementById("callPopup").style.display="flex";
document.getElementById("callVideo").src="https://files.catbox.moe/4czbh7.mp4";
document.getElementById("callVideo").play();
},15000);

function closeCall(){
document.getElementById("callPopup").style.display="none";
}

</script>

</body>
</html>
