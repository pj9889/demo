<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Traffic Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            transition: background 0.2s;
        }
        .btn-refresh:hover {
            background-color: #0369a1;
        }
        .table-container {
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 20px;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover {
            background-color: #2b3a55;
        }
        .status-badge {
            background-color: #0ea5e9;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .time-text {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Live Traffic & Action Tracking</h1>
        
        <button class="btn-refresh" onclick="fetchLogData()">🔄 Refresh Data</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Country Calling Code</th>
                        <th>User Action / Click Event</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #94a3b8;">Loading track logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // আপনার গুগল শিটের 'Publish to Web' থেকে নেওয়া CSV লিংকটি এখানে বসান
        const SHEET_CSV_URL = "আপনার_গুগল_শিটের_CSV_লিংক";

        function fetchLogData() {
            if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("আপনার_গুগল_শিটের")) {
                document.getElementById('logTableBody').innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ef4444;">দয়া করে ড্যাশবোর্ড কোডের ভেতরে 'SHEET_CSV_URL' পরিবর্তন করুন।</td></tr>`;
                return;
            }

            fetch(SHEET_CSV_URL)
                .then(response => response.text())
                .then(csvText => {
                    let rows = csvText.split('\n');
                    let tableBody = document.getElementById('logTableBody');
                    tableBody.innerHTML = '';

                    // উল্টো দিক থেকে লুপ চালানো যাতে নতুন ডেটা ওপরে দেখায়
                    for (let i = rows.length - 1; i >= 1; i--) {
                        if (!rows[i].trim()) continue;
                        
                        // CSV কলাম বিভক্ত করা (কমা দিয়ে)
                        let columns = rows[i].split(',');
                        if(columns.length >= 3) {
                            let timestamp = columns[0].replace(/"/g, '');
                            let countryCode = columns[1].replace(/"/g, '');
                            let action = columns[2].replace(/"/g, '');

                            let tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td class="time-text">${timestamp}</td>
                                <td style="font-weight: bold; color: #e2e8f0;">${countryCode}</td>
                                <td><span class="status-badge">${action}</span></td>
                            `;
                            tableBody.appendChild(tr);
                        }
                    }
                    
                    if(tableBody.innerHTML === '') {
                        tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8;">No data found in sheet.</td></tr>`;
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('logTableBody').innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ef4444;">Error loading data from Google Sheets.</td></tr>`;
                });
        }

        // পেজ লোড হলে এবং প্রতি ৩০ সেকেন্ড পর পর স্বয়ংক্রিয় রিফ্রেশ হবে
        window.onload = fetchLogData;
        setInterval(fetchLogData, 30000);
    </script>
</body>
</html>
