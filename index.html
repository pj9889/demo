<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survi Video Service</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
text-align:center;
}

/* PROFILE */
.profile{
margin-top:20px;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
border:3px solid red;
object-fit:cover;
}

h1{margin:10px 0;}

/* IMAGES */
.row{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.row img{
width:45%;
border-radius:10px;
}

/* DESCRIPTION */
.desc{
max-width:500px;
margin:auto;
padding:15px;
color:#333;
line-height:1.5;
}

/* BUTTON */
.btn{
background:red;
color:white;
padding:15px 25px;
border:none;
font-size:18px;
border-radius:5px;
cursor:pointer;
position:relative;
overflow:hidden;
}

.btn::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:yellow;
opacity:0.5;
transition:2s;
}

.btn:hover::after{
left:0;
}

/* PAYMENT */
#payment{
display:none;
padding-top:80px;
}

.box{
background:white;
padding:30px;
margin:auto;
width:80%;
max-width:400px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* CALL MODAL */
#call{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.85);
align-items:center;
justify-content:center;
}

.callBox{
background:#111;
padding:15px;
border-radius:10px;
width:300px;
color:white;
}

video{
width:100%;
border-radius:10px;
}

small{color:yellow;}
textarea{
width:90%;
height:60px;
margin-top:10px;
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="main">

<div class="profile">
<img src="https://files.catbox.moe/hnc2d4.jpeg">
<h1>সুরভী খাতুন</h1>
</div>

<div class="row">
<img src="https://files.catbox.moe/lj7phy.jpeg">
<img src="https://files.catbox.moe/47p5f3.jpeg">
</div>

<div class="desc">
আমি সুরভী খাতুন। আমি নিয়মিত ভিডিও কল সার্ভিস দিয়ে থাকি।  
আপনার যদি ভিডিও কল সার্ভিস প্রয়োজন হয় তাহলে আপনি আমাকে কল করতে পারেন।  
আমার সার্ভিস প্রিমিয়াম এবং ভিআইপি।
</div>

<button class="btn" onclick="openPay()">সার্ভিস কিনুন</button>

<br><br>

<!-- MESSAGE BOX -->
<div>
<textarea id="msg" placeholder="আপনার মেসেজ লিখুন..."></textarea>
<br>
<button class="btn" onclick="sendMsg()">মেসেজ পাঠান</button>
</div>

</div>

<!-- PAYMENT PAGE -->
<div id="payment">
<div class="box">
<h2>💳 Payment Page</h2>
<p>এখানে পরে bKash / Nagad যুক্ত করা হবে</p>
<br>
<button onclick="back()">⬅ Back</button>
</div>
</div>

<!-- CALL POPUP -->
<div id="call">
<div class="callBox">
<small>📞 DEMO VIDEO CALL</small>
<video id="vcall" controls></video>
<br><br>
<button onclick="closeCall()">Close</button>
</div>
</div>

<script>

function openPay(){
let b=document.querySelector(".btn");
b.style.background="yellow";
b.style.color="black";

setTimeout(()=>{
document.getElementById("main").style.display="none";
document.getElementById("payment").style.display="block";
},2000);
}

function back(){
document.getElementById("payment").style.display="none";
document.getElementById("main").style.display="block";
}

/* AUTO CALL AFTER 15 SEC */
setTimeout(()=>{
document.getElementById("call").style.display="flex";
document.getElementById("vcall").src="https://files.catbox.moe/4czbh7.mp4";
document.getElementById("vcall").play();
},15000);

function closeCall(){
document.getElementById("call").style.display="none";

/* AUDIO AFTER CALL END */
let a1=new Audio("https://files.catbox.moe/8u5x9r.mp3");
let a2=new Audio("https://files.catbox.moe/8u5x9r.mp3");

a1.play();

setTimeout(()=>{
a2.play();
},4000);
}

/* MESSAGE SYSTEM (demo) */
function sendMsg(){
let msg=document.getElementById("msg").value;

if(msg.trim()==""){
alert("মেসেজ লিখুন");
return;
}

alert("মেসেজ পাঠানো হয়েছে");

setTimeout(()=>{
let audio=new Audio("https://files.catbox.moe/8u5x9r.mp3");
audio.play();
},5000);
}

</script>

</body>
</html>
